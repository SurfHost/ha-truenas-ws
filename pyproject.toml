[project]
name = "ha-truenas"
# Kept in step with custom_components/truenas_ws/manifest.json. The release-gate
# job in CI fails a tag push when the two disagree.
version = "0.7.1"
description = "TrueNAS integration for Home Assistant using JSON-RPC 2.0 WebSocket API"
requires-python = ">=3.14.2"
license = "MIT"

dependencies = [
    # 2026.8.0 is the real floor, not a guess: the device registry's
    # async_get_device_by_identifier and DeviceInfo.via_device_id first shipped
    # in 2026.8.0 (neither is in 2026.7.0). HA 2026.8.0 also requires Python 3.14.2,
    # hence requires-python above.
    "homeassistant>=2026.8.0",
]

[project.optional-dependencies]
dev = [
    # 2026.10.0 is the newest stubs release; it knows the 2026.8 registry APIs.
    "homeassistant-stubs>=2026.10.0",
    "mypy",
    "pre-commit",
    "pylint",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "ruff",
    "codespell",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# HA custom component > nothing to build/install as a wheel
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "T20",
    "RUF",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
