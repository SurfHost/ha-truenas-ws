[project]
name = "ha-truenas"
# Kept in step with custom_components/truenas_ws/manifest.json. The release-gate
# job in CI fails a tag push when the two disagree.
version = "0.7.0"
description = "TrueNAS integration for Home Assistant using JSON-RPC 2.0 WebSocket API"
requires-python = ">=3.13"
license = "MIT"

dependencies = [
    # 2024.6.0 is the real floor, not a guess: entry.runtime_data and the generic
    # ConfigEntry[T] this package relies on only exist from 2024.6 onward, and the
    # PEP 695 "type" / "def f[T]()" syntax in coordinator.py needs Python 3.12,
    # which HA only started requiring in 2024.4.
    "homeassistant>=2024.6.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant-stubs",
    "mypy",
    "pre-commit",
    "pylint",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "ruff",
    "codespell",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# HA custom component > nothing to build/install as a wheel
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "T20",
    "RUF",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
